apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: devops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: nginx
          image: YOUR_DOCKERHUB_USERNAME/devops-cicd-webapp:initial
          imagePullPolicy: Always
          ports:
            - containerPort: 80